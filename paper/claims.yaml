  macro: MacroBreakEvenPenalty
  expected_val: 1.35
- id: CLAIM_C26_CYCLES_FOUR_BIT_SIMD
  statement: Hardware trace cycles/MAC for 4-bit SIMD is 5.28 cycles/MAC.
  macro: MacroCyclesFourBitSIMD
  expected_val: 5.28
- id: CLAIM_C27_CYCLES_TWO_BIT_SIMD
  statement: Hardware trace cycles/MAC for 2-bit SIMD is 4.51 cycles/MAC.
  macro: MacroCyclesTwoBitSIMD
  expected_val: 4.51
- id: CLAIM_C28_SWEEP_CONFIGS
  statement: Sensitivity sweep total evaluated parameter configurations is 888.
  macro: MacroSensitivitySweepPoints
  expected_val: 888.0
- id: CLAIM_C29_PTQ_MEDIAN_DELTA_35
  statement: Median accuracy drop in PTQ at 35% budget is 18.91 points.
  macro: MacroPTQMedianDeltaThirtyFive
  expected_val: 18.91
- id: CLAIM_C30_FINETUNE_EPOCHS
  statement: Default fine-tuning schedule evaluates 5 epochs.
  macro: MacroFTEpochs
  expected_val: 5.0
